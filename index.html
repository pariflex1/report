<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leads - Krishna Anandam</title>
  <meta name="description" content="Krishna Anandam Facebook Ads Leads" />
  <meta property="og:title" content="Details of Facebook Ads Leads - Krishna Anandam" />
  <meta property="og:description" content="Facebook Ads Leads for Krishna Anandam" />
  <meta property="og:image" content="https://github.com/pariflex1/rising-lead-report/blob/main/og.webp?raw=true" />
   <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; background: #f9f9f9; }
    h2 { text-align: center; margin-bottom: 5px; }
    #reportDate { text-align: center; font-weight: 500; margin-bottom: 10px; color: #555; }

    .filter {
      text-align: center;
      margin-bottom: 20px;
    }
    .filter input {
      padding: 6px;
      font-size: 15px;
      margin: 0 5px; /* Add some margin for date inputs */
    }

    .table-wrapper {
      overflow-x: auto;
      background: white;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 0 6px rgba(0,0,0,0.1);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px; /* Adjusted min-width for fewer columns */
    }
    thead {
      background: #2c3e50;
      color: white;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    th, td {
      padding: 8px 12px;
      border: 1px solid #ddd;
      text-align: left;
      white-space: nowrap;
    }
    tr:hover {
      background-color: #f1f1f1;
    }

    .category-counts {
      max-width: 600px;
      margin: 30px auto;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 6px rgba(0,0,0,0.05);
    }
    .category-counts h3 {
      text-align: center;
      margin-bottom: 10px;
    }
    .category-counts ul {
      list-style: none;
      padding: 0;
    }
    .category-counts li {
      padding: 4px 0;
      font-size: 15px;
      text-align: center;
    }

    .print-button-container {
        text-align: center;
        margin-top: 20px;
    }

    .print-button {
        padding: 10px 20px;
        font-size: 16px;
        background-color: #2c3e50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .print-button:hover {
        background-color: #1a242f;
    }

    @media (max-width: 600px) {
      table { font-size: 14px; }
    }

    @media print {
        body {
            background: none;
        }
        .filter, .print-button-container, #reportDate, .category-counts {
            display: none;
        }
        .table-wrapper {
            box-shadow: none;
            padding: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #000;
            padding: 5px;
        }
        thead {
            background: #eee;
            color: #000;
        }
    }
  </style>
</head>
<body>

<h2>Leads – Krishna Anandam</h2>
<p id="reportDate"></p>

<div class="filter">
  <label for="filterStartDate">From Date:</label>
  <input type="date" id="filterStartDate" max="">
  <label for="filterEndDate">To Date:</label>
  <input type="date" id="filterEndDate" max="">
</div>

<div class="table-wrapper">
  <table id="dataTable">
    <thead>
      <tr>
        <th>Timestamp</th>
        <th>Client Name</th>
        <th>Contact</th>
        <th>About</th>
        <th>Note</th>
        <th>Lead From</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="6">Loading...</td></tr> </tbody>
  </table>
</div>

<div class="category-counts" id="categoryCounts">
  <h3>Lead Summary</h3>
  <ul id="categoryList">
    <li>Loading summary...</li>
  </ul>
</div>

<div class="print-button-container">
    <button class="print-button" onclick="window.print()">Print Report</button>
</div>

<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbyAvYBJSuhTW9I-qDgVWU2ICBJm45P6D3VcXKlq-GFYaK-SZakduMDa2fgtc3RILULi/exec';
  let allData = []; // Store all fetched data
  let allEntriesCount = 0; // Store the total count of entries

  function today() {
    const now = new Date();
    return now.toISOString().split("T")[0];
  }

  function displayCurrentDate() {
    const now = new Date();
    const options = { day: '2-digit', month: '2-digit', year: 'numeric', weekday: 'short' };
    document.getElementById('reportDate').textContent =
      `Report Generated On: ${now.toLocaleDateString('en-GB', options)}`;
  }

  // Helper function to parse 'dd-mm-yyyy hh:mm:ss' string into a Date object
  function parseDateTimeString(dateTimeString) {
    if (!dateTimeString) return null;

    const parts = dateTimeString.split(' ');
    if (parts.length !== 2) return null; // Expects "date time"

    const datePart = parts[0]; // e.g., "06/07/2025"
    const timePart = parts[1]; // e.g., "11:26:05"

    const [day, month, year] = datePart.split('-').map(Number);
    const [hours, minutes, seconds] = timePart.split(':').map(Number);

    // Month is 0-indexed in JavaScript Date constructor (January is 0, December is 11)
    return new Date(year, month - 1, day, hours, minutes, seconds);
  }

  function filterByDateRange(data, startDateStr, endDateStr) {
    // Convert input date strings (yyyy-mm-dd from input type="date") to Date objects
    const start = new Date(startDateStr);
    const end = new Date(endDateStr);
    
    // Set end date to the end of the day for inclusive filtering
    if (end) {
        end.setHours(23, 59, 59, 999); 
    }

    const rows = data.slice(1); // Exclude header row
    return rows.filter(row => {
      const timestampString = row[0]; // Get the timestamp string from the sheet
      if (!timestampString) return false; // Skip if timestamp is empty

      const rowDate = parseDateTimeString(timestampString);

      // Check if rowDate is a valid Date object and falls within the range
      return rowDate instanceof Date && !isNaN(rowDate) && rowDate >= start && rowDate <= end;
    });
  }

  function renderTable(rows) {
    const tbody = document.getElementById('tableBody');
    if (rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6">No entries for the selected date range.</td></tr>'; // Adjusted colspan
      return;
    }
    // Define which columns to display (indices in original data)
    // Assuming original sheet columns are: [0]Timestamp, [1]Client Name, [2]Contact, [3]About, [4]Note, [5]Lead From, [6]Site, [7]Meeting Date, [8]Meeting Time
    const columnsToDisplay = [0, 1, 2, 3, 4, 5]; // Timestamp, Client Name, Contact, About, Note, Lead From

    tbody.innerHTML = rows.map(row => `
      <tr>
        ${columnsToDisplay.map(index => `<td>${row[index] || ''}</td>`).join('')}
      </tr>
    `).join('');
  }

  function renderCategoryCounts(rows) {
    const aboutIndex = 3; // Index for 'About' column in the original data

    let villaCount = 0;
    let plotsCount = 0;
    let investmentCount = 0;
    let liveInCount = 0;
    let detailsCount = 0;

    rows.forEach(row => {
      const about = (row[aboutIndex] || '').toLowerCase();
      if (about.includes('villa')) villaCount++;
      if (about.includes('plots')) plotsCount++;
      if (about.includes('investment')) investmentCount++;
      if (about.includes('live in')) liveInCount++;
      if (about.includes('details')) detailsCount++;
    });

    const list = document.getElementById('categoryList');
    list.innerHTML = `
      <li><strong>Total Entries in Sheet:</strong> ${allEntriesCount}</li>
      <li><strong>Total Leads (Selected Range):</strong> ${rows.length}</li>
      <li><strong>Interest</strong></li>
      <li>Villa: ${villaCount}</li>
      <li>Plots: ${plotsCount}</li>
      <li><strong>Purpose</strong></li>
      <li>Investment: ${investmentCount}</li>
      <li>Live In: ${liveInCount}</li>
      <li>Details: ${detailsCount}</li>
    `;
  }

  function fetchAndRender() {
    const startDate = document.getElementById('filterStartDate').value;
    const endDate = document.getElementById('filterEndDate').value;

    // Only fetch data once to avoid repeated network requests
    if (allData.length === 0) { 
        fetch(scriptURL)
            .then(res => res.json())
            .then(data => {
                allData = data.values; // Store all data
                if (allData && allData.length > 0) {
                    allEntriesCount = allData.length - 1; // Exclude header row for total count
                } else {
                    allEntriesCount = 0;
                }
                applyFiltersAndRender(startDate, endDate);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="6">Failed to load data</td></tr>'; // Adjusted colspan
                document.getElementById('categoryList').innerHTML = '<li>Failed to load summary</li>';
            });
    } else {
        applyFiltersAndRender(startDate, endDate);
    }
  }

  function applyFiltersAndRender(startDate, endDate) {
    let rows = filterByDateRange(allData, startDate, endDate);

    // Z to A sort by Timestamp (index 0)
    rows.sort((a, b) => {
      const dateA = parseDateTimeString(a[0]);
      const dateB = parseDateTimeString(b[0]);

      // Handle invalid dates by placing them at the end or beginning
      if (!dateA || isNaN(dateA)) return 1;
      if (!dateB || isNaN(dateB)) return -1;
      
      return dateB.getTime() - dateA.getTime(); // Sort descending
    });

    renderTable(rows);
    renderCategoryCounts(rows);
  }

  displayCurrentDate();

  const filterStartDateInput = document.getElementById("filterStartDate");
  const filterEndDateInput = document.getElementById("filterEndDate");
  const todayDate = today();

  filterStartDateInput.value = todayDate;
  filterEndDateInput.value = todayDate;
  filterStartDateInput.max = todayDate;
  filterEndDateInput.max = todayDate;

  filterStartDateInput.addEventListener("change", fetchAndRender);
  filterEndDateInput.addEventListener("change", fetchAndRender);

  fetchAndRender(); // Initial fetch and render
</script>

</body>
</html>
